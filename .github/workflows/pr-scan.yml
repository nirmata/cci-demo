name: PR-scan

on: [push]

concurrency:
  group: ci-build-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  scan-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

# Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout template
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289  # v0.2.0

      - name: Check Kyverno install
        run: kyverno version

      - name: Validate manifests
        run: |
          kyverno apply https://github.com/nirmata/cci-policies/policies/ -b main  --resource=./nginx
        
